  if (embedScript && embedScript.parentNode) {

    host.innerHTML = "<div id=\"foodnorm-calculator\" dir=\"rtl\" lang=\"he\">\n  <h2>מחשבון תקציב מזון למשפחה</h2>\n  <p>הוסיפו את בני המשפחה כדי לחשב תקציב חודשי למשפחה פעילה ולא פעילה.</p>\n  <form id=\"foodnorm-form\">\n    <div id=\"foodnorm-people\"></div>\n    <button type=\"button\" id=\"foodnorm-add\">הוספת בן/בת משפחה</button>\n    <button type=\"submit\">חישוב</button>\n  </form>\n  <p id=\"foodnorm-message\" role=\"status\"></p>\n  <div id=\"foodnorm-results\" hidden aria-live=\"polite\">\n<section><h3>משפחה פעילה</h3><dl><dt>תקציב מינימלי למזון</dt><dd data-result=\"foodNormActive\">—</dd><dt>מספר סלים</dt><dd data-result=\"basketsActive\">—</dd><dt>סל נמוך (ZL)</dt><dd data-result=\"lowActive\">—</dd><dt>סל גבוה (ZU)</dt><dd data-result=\"highActive\">—</dd></dl></section><section><h3>משפחה לא פעילה</h3><dl><dt>תקציב מינימלי למזון</dt><dd data-result=\"foodNormSed\">—</dd><dt>מספר סלים</dt><dd data-result=\"basketsSed\">—</dd><dt>סל נמוך (ZL)</dt><dd data-result=\"lowSed\">—</dd><dt>סל גבוה (ZU)</dt><dd data-result=\"highSed\">—</dd></dl></section></div><p class=\"foodnorm-note\">הסכומים חודשיים לכל המשפחה, לפי מחירי הבסיס של המודל. חישוב המזון אינו כולל ילדים מתחת לגיל שנתיים.</p></div>\n<style>\n#foodnorm-calculator {max-width:860px;margin:24px auto;padding:24px;font-family:Arial,sans-serif;color:#292929;background:#fafafa;border-radius:12px;box-sizing:border-box}\n#foodnorm-calculator * {box-sizing:border-box}\n#foodnorm-calculator h2 {margin-top:0}\n#foodnorm-calculator .foodnorm-person {display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin:14px 0}\n#foodnorm-calculator label {display:flex;flex-direction:column;gap:6px}\n#foodnorm-calculator input,#foodnorm-calculator select {font:inherit;padding:10px;border:1px solid #999;border-radius:5px;width:140px;background:white;color:#292929}\n#foodnorm-calculator button {font:inherit;padding:10px 16px;margin:4px 0;cursor:pointer;border:1px solid #555;border-radius:5px;background:white;color:#292929}\n#foodnorm-calculator button[type=submit] {background:#235947;color:white;border-color:#235947}\n#foodnorm-calculator #foodnorm-results:not([hidden]) {display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}\n#foodnorm-calculator section {background:white;padding:20px;border:1px solid #ddd;border-radius:8px}\n#foodnorm-calculator dt {margin-top:20px;font-weight:bold}\n#foodnorm-calculator dd {margin:6px 0;font-size:1.3em}\n#foodnorm-calculator .foodnorm-note {font-size:.9em;color:#555;line-height:1.6}\n@media(max-width:540px){#foodnorm-calculator #foodnorm-results:not([hidden]){grid-template-columns:1fr}#foodnorm-calculator{padding:16px}}\n</style>\n";

function init() {
  const root = document.getElementById('foodnorm-calculator');
  if (!root || root.dataset.initialized) return;
  root.dataset.initialized = 'true';
  const peopleEl = root.querySelector('#foodnorm-people');
  const resultsEl = root.querySelector('#foodnorm-results');
  const message = root.querySelector('#foodnorm-message');
  const invalidate = () => { resultsEl.hidden = true; message.textContent = ''; };
  function addPerson() {
    const row = document.createElement('div');
    row.className = 'foodnorm-person';
    row.innerHTML = '<label>גיל בשנים מלאות<input type="number" min="0" step="1" required aria-label="גיל בשנים מלאות"></label><label>מין<select><option value="male">זכר</option><option value="female">נקבה</option></select></label><button type="button">הסרה</button>';
    row.querySelector('button').addEventListener('click', () => { row.remove(); invalidate(); });
    peopleEl.appendChild(row);
    invalidate();
  }
  root.querySelector('#foodnorm-add').addEventListener('click', addPerson);
  peopleEl.addEventListener('input', invalidate);
  peopleEl.addEventListener('change', invalidate);
  root.querySelector('form').addEventListener('submit', event => {
    event.preventDefault();
    invalidate();
    const people = Array.from(peopleEl.children, row => ({age:Number(row.querySelector('input').value),sex:row.querySelector('select').value}));
    if (!people.length) { message.textContent = 'יש להוסיף לפחות בן/בת משפחה אחד/ת.'; return; }
    const results = getResults(people);
    root.querySelectorAll('[data-result]').forEach(el => {
      const key = el.dataset.result;
      el.textContent = new Intl.NumberFormat('he-IL', {maximumFractionDigits:2}).format(results[key]) + (key.startsWith('baskets') ? '' : ' ₪');
    });
    resultsEl.hidden = false;
  });
  addPerson();
}
function getResults(people) {
  
  // find sum
  
  let sumActive = 0;
  let sumSed = 0;
  
  people.forEach(person => {
    
    if (person.age < 2) return;
    
    
    let ageGroups = monthlyCalorieIntake[person.sex];
    
    if (person.age <= monthlyCalorieIntake.child[0].age.max) {
      
      // children's sex does not affect their intake
      ageGroups = monthlyCalorieIntake.child;
      
    }
    
    
    let intake;
    
    for (let i = 0; i < ageGroups.length; i++) {
      
      // find the person's age group
      
      const ageGroup = ageGroups[i];
      
      let inAgeGroup = true;
      
      if ('min' in ageGroup.age) {
        
        if (ageGroup.age.min > person.age) {
          
          inAgeGroup = false;
          
        }
        
      }
      
      if ('max' in ageGroup.age) {
        
        if (ageGroup.age.max < person.age) {
          
          inAgeGroup = false;
          
        }
        
      }
      
      
      if (inAgeGroup) {
        
        intake = ageGroup.intake;
        
        break;
        
      }
      
    }
    
    
    sumActive += intake.active;
    sumSed += intake.sed;
    
  });
  
  
  const basketsActive = sumActive / caloriesPerBasket;
  const basketsSed = sumSed / caloriesPerBasket;
  
  const foodNormActive = basketsActive * minBasketPrice;
  const foodNormSed = basketsSed * minBasketPrice;
  
  
  return {
    foodNormActive,
    foodNormSed,
    basketsActive,
    basketsSed,
    ...getHouseholdThresholds(people, foodNormActive, foodNormSed)
  };
  
}

function getHouseholdThresholds(people, foodNormActive, foodNormSed) {
  const counts = Array(14).fill(0);
  people.forEach(({age, sex}) => {
    const numericAge = Number(age);
    if (!Number.isInteger(numericAge) || numericAge < 0 ||
        (sex !== 'male' && sex !== 'female')) {
      throw new Error('Household members need a non-negative integer age and male/female sex.');
    }
    const group = regressionAgeMaxima.findIndex(max => numericAge <= max);
    counts[group * 2 + (sex === 'female' ? 1 : 0)] += 1;
  });

  // Add the intercept once per household, not once per person.
  const predict = weights => counts.reduce(
    (total, count, index) => total + count * weights[index + 1], weights[0]
  );
  return {
    // Both lower regressions predict food spending, which must be converted to ZL.
    lowActive: 2 * foodNormActive - predict(regressionWeights.active_zl_weights),
    lowSed: 2 * foodNormSed - predict(regressionWeights.sedentary_zl_weights),
    highActive: predict(regressionWeights.active_zu_weights),
    highSed: predict(regressionWeights.sedentary_zu_weights)
  };
}
